name: Deploy GCP Main Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'main/**'
      - '.github/workflows/deploy-gcp-main.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy GCP Infrastructure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12'
          cache: 'npm'
          cache-dependency-path: main/package-lock.json
      
      - name: Install dependencies
        working-directory: main
        run: npm ci
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_NAME }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      
      - name: Setup Pulumi
        uses: pulumi/actions@v5
      
      - name: Deploy GCP Infrastructure
        uses: pulumi/actions@v5
        with:
          work-dir: ./main
          command: up
          stack-name: dev-gcp
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
