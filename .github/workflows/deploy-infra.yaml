name: deploy-infra-workflow
run-name: Build AFL tracker base infra by @${{ github.actor }}
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
  id-token: write
jobs:
  pulumi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_NAME }}
          # IMPORTANT: For Direct Resource Access, leave 'service_account' EMPTY.
          # This tells the action to use the Federated Identity directly.
          create_credentials_file: true
          export_environment_variables: true
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12'
          cache: 'npm'
          cache-dependency-path: './main/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Pulumi Preview/Up
        uses: pulumi/actions@v5
        with:
          command: ${{ github.event_name == 'push' && 'up' || 'preview' }}
          stack-name: dev
          work-dir: ./main
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}